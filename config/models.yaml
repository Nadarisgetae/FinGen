# FinGen v2 — Model Routing Config
# OpenRouter Free Models (strictly non-Google: Qwen, Llama, DeepSeek, Nemotron, Mistral)

tasks:
  extract:
    - nvidia/nemotron-3-ultra:free
    - qwen/qwen-2.5-72b-instruct:free
    - meta-llama/llama-3.3-70b-instruct:free
    - meta-llama/llama-3.1-70b-instruct:free
    - deepseek/deepseek-chat:free
    - openrouter/auto
  longdoc:
    - nvidia/nemotron-3-ultra:free
    - qwen/qwen-2.5-72b-instruct:free
    - meta-llama/llama-3.1-70b-instruct:free
    - mistralai/mistral-nemo:free
    - openrouter/auto
  write:
    - qwen/qwen-2.5-72b-instruct:free
    - meta-llama/llama-3.3-70b-instruct:free
    - meta-llama/llama-3.1-70b-instruct:free
    - deepseek/deepseek-chat:free
    - mistralai/mistral-small-24b-instruct-2501:free
    - openrouter/auto
  verify:
    - qwen/qwen-2.5-72b-instruct:free
    - meta-llama/llama-3.3-70b-instruct:free
    - deepseek/deepseek-chat:free
    - mistralai/mistral-small-24b-instruct-2501:free
    - openrouter/auto

fallback_provider: openrouter_paid

# Paid fallback keys (used when ALL free keys exhausted)
# Add to st.secrets.OPENROUTER_PAID_KEYS
paid_fallback_enabled: true
