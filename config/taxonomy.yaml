# =============================================================================
guidance:

  revenue_guidance:
    label: "Revenue Guidance"
    aliases: ["Revenue guidance", "Revenue target"]
    unit_default: "INR_cr"
    sign: "+"

  growth_guidance:
    label: "Growth Guidance"
    aliases: ["Growth guidance", "Revenue growth guidance"]
    unit_default: "percentage"
    sign: "+"

  capex_guidance:
    label: "Capex Guidance"
    aliases: ["Capex guidance", "Capital expenditure guidance"]
    unit_default: "INR_cr"
    sign: "+"
