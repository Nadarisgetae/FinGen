    aliases: ["Net cash from investing activities", "Cash flow from investing activities", "Net cash used in investing activities"]
    unit_default: "INR_cr"
    sign: "+"

  cff:
    label: "Cash Flow from Financing Activities"
    aliases: ["Net cash from financing activities", "Cash flow from financing activities", "Net cash used in financing activities"]
    unit_default: "INR_cr"
    sign: "+"

  capex:
    label: "Capital Expenditure"
    aliases: ["Capital expenditure", "Purchase of property, plant and equipment", "Additions to fixed assets", "Capital work-in-progress", "Expenditure on fixed assets"]
    unit_default: "INR_cr"
    sign: "-"

  principal_repayment:
